name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate the extension command catalog and C# attributes
        run: python -B tools/validate_catalog.py
      - name: Verify the generated extension command reference
        run: python -B tools/generate_tool_reference.py --check
