[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "unity-mcp-server"
version = "0.1.1"
description = "Dynamic Python MCP gateway for Unity Editor and desktop Development Players"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DucMinh" }]
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "mcp[cli]>=2.0.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
unity-mcp = "unity_mcp_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unity_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
